<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1015" />
    <meta
      name="description"
      content="Moon Goons public cooperative space-extraction playtest."
    />
    <title>Moon Goons — Public Playtest</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
        background: #080d11;
        color: #f4e9cf;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 35%, rgb(43 64 70 / 45%), transparent 38%),
          repeating-linear-gradient(0deg, rgb(255 255 255 / 2%) 0 1px, transparent 1px 4px),
          #080d11;
      }

      iframe {
        display: block;
        border: 0;
        background: #080d11;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: #080d11;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      .boot-screen[data-ready="true"] {
        opacity: 0;
        visibility: hidden;
      }

      .boot-card {
        width: min(34rem, calc(100vw - 3rem));
        border: 1px solid #b98543;
        padding: 1.4rem 1.6rem;
        background: #11191e;
        box-shadow: 0 1.2rem 4rem rgb(0 0 0 / 55%);
      }

      .agency {
        margin: 0 0 0.6rem;
        color: #d39a50;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.22em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        line-height: 0.82;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 1.25rem 0 0;
        color: #b9c6c2;
        font: 700 0.75rem/1.2 ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .status::before {
        width: 0.58rem;
        height: 0.58rem;
        border-radius: 50%;
        background: #dd8a3c;
        box-shadow: 0 0 0.9rem #dd8a3c;
        content: "";
        animation: pulse 800ms ease-in-out infinite alternate;
      }

      @keyframes pulse {
        to {
          opacity: 0.3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          transition: none;
        }

        .status::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="boot-screen" id="boot-screen" aria-live="polite">
        <div class="boot-card">
          <p class="agency">S.P.A.C.E. // FIELD SYSTEMS</p>
          <h1>Moon<br />Goons</h1>
          <p class="status">Establishing public playtest uplink</p>
        </div>
      </div>
      <iframe
        id="playtest"
        src="https://moon-goons-practice.tswizzle777.chatgpt.site/"
        title="Moon Goons public playtest"
        allow="fullscreen; gamepad *; clipboard-write"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
    <script>
      const playtest = document.querySelector("#playtest");
      const bootScreen = document.querySelector("#boot-screen");

      playtest.addEventListener("load", () => {
        window.setTimeout(() => {
          bootScreen.dataset.ready = "true";
        }, 250);
      });
    </script>
  </body>
</html>
