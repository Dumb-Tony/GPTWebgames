name: Deploy Moon Goons Playtest

on:
  push:
    branches:
      - MoonGoons
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Moon Goons
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public playtest
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages

      - name: Deploy public playtest
        id: deployment
        uses: actions/deploy-pages@v4
